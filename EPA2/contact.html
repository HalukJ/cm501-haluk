<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Campus Café</title>
<link rel="stylesheet" href="before.css">
</head>
<body>
<div id="wrap">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="top">
    <div class="logo">Campus Café</div>
    <nav class="nav">
      <a href="menu.html">MENU</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">
  <h1 class="h">Contact</h1>
  <p>Phone: <a href="tel:+498900000000">+49 89 000 000 00</a><br>
  <a href="mailto:hello@campus-cafe.example">hello@campus-cafe.example</a></p>
  <div>Example Street 1, 80000 Munich</div>
  <br>
  <iframe title="Map of Munich" src="https://maps.google.com/maps?q=Munich&z=12&output=embed" width="1100" height="320" style="border:0"></iframe>

  <h2 class="h" style="font-size:24px">Newsletter &amp; reservations</h2>
  <p>Name and email are required. The other fields are optional.</p>
  <form action="https://campus-cafe.example/subscribe" method="get">
    <label for="name">Name (required)</label><br>
    <input id="name" type="text" name="name" autocomplete="name" required placeholder="Name"><br><br>
    <label for="email">Email (required)</label><br>
    <input id="email" type="email" name="email" autocomplete="email" required placeholder="E-Mail"><br><br>
    <label for="birthday">Birthday (optional)</label><br>
    <input id="birthday" type="date" name="birthday" autocomplete="bday"><br><br>
    <label for="phone">Phone (optional)</label><br>
    <input id="phone" type="tel" name="phone" autocomplete="tel" placeholder="Phone"><br><br>
    <label for="msg">Message (optional)</label><br>
    <textarea id="msg" name="msg" placeholder="Message"></textarea><br><br>
    <button class="btn2" type="submit">Send</button>
  </form>
  </main>
  <footer class="foot">
    <a href="https://www.facebook.com/" aria-label="Facebook website"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-2.8 0-4 1.7-4 4v2H8v4h2v8h4v-8h3l1-4h-4V8.5c0-.4.2-.5.5-.5z"/></svg></a>
    <a href="https://www.instagram.com/" aria-label="Instagram website"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/></svg></a>
    <br><br>© Campus Café
  </footer>
</div>
</body>
</html>
